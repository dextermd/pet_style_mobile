name: pet_style_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.0

  internet_connection_checker_plus: ^2.7.0

  searchfield: ^1.2.4

  # bloc
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_screenutil: ^5.9.3

  flutter_widget_from_html: ^0.15.3


  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.0.17

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  get_it: ^8.0.3
  go_router: ^14.8.0
  badges: ^3.1.2
  google_fonts: ^6.2.1


  fluttertoast: ^8.2.12
  
  animated_splash_screen: ^1.3.0
  lottie: ^3.3.1

  shared_preferences: ^2.5.2

  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  timezone: ^0.10.0

  dio: ^5.8.0+1

  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5

  device_info_plus: ^11.3.0
  android_id: ^0.4.0
  package_info_plus: ^8.2.1
  flutter_local_notifications: ^18.0.1

  #logger
  talker: 4.6.11
  talker_flutter: ^4.6.11
  talker_dio_logger: ^4.6.11
  talker_bloc_logger: ^4.6.11
  
  #auth
  google_sign_in: ^6.2.2
  
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  date_picker_timeline: ^1.2.6
  easy_date_timeline: ^2.0.6
  
  pinput: ^5.0.1
  
  http_parser: ^4.1.2

  animate_do: ^4.0.1
  #chat
  socket_io_client: ^3.0.2

  #toast
  toastification: ^2.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.9.0
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter_gen:
    output: lib/gen
    line_length: 80
    
    integrations:
      flutter_svg: true
      lottie: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/json/
    - assets/fonts/
  fonts:
  - family: Jost
    fonts:
    - asset: assets/fonts/Jost-Regular.ttf
      weight: 400
    - asset: assets/fonts/Jost-Medium.ttf
      weight: 500
    - asset: assets/fonts/Jost-SemiBold.ttf
      weight: 600
    - asset: assets/fonts/Jost-Bold.ttf
      weight: 700
    - asset: assets/fonts/Jost-Light.ttf
      weight: 200
